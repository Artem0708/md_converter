name: Auto Convert to Markdown

# Запускать, когда что-то пушится в папку input
on:
  push:
    paths:
      - 'input/**'

# Разрешаем роботу записывать файлы в репозиторий
permissions:
  contents: write

jobs:
  convert_files:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Устанавливаем playwright для работы с веб-контентом (если нужно markitdown)
          playwright install
          
      - name: Run conversion script
        run: python convert.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          # Добавляем всё, что появилось в output
          git add output/*
          # Проверяем, есть ли изменения перед коммитом
          if git diff --staged --quiet; then
            echo "Нет изменений для сохранения"
          else
            git commit -m "Автоматическая конвертация в Markdown 📝"
            git push
          fi